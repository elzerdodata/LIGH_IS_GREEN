# Clean-clone build of Light_is_Green: WebRTC deps + the .nro, exactly as a
# contributor would build them. Catches works-only-on-one-machine breakage
# (missing files, unresolved symbols) before it lands on main.
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build WebRTC deps (libpeer/srtp/usrsctp/mbedtls)
        run: bash deps/build-switch.sh

      - name: Build Light_is_Green.nro
        run: docker run --rm -v "$PWD":/src -w /src devkitpro/devkita64 make

      - name: Locate artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          nro="$(find . -maxdepth 1 -type f -name 'Light_is_Green-v*.nro' -print -quit)"
          test -n "$nro"
          ls -lh "$nro"
          echo "path=$nro" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Light_is_Green-nro
          path: ${{ steps.artifact.outputs.path }}
